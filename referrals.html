<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LBC Referrals</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://telegram.org/js/telegram-web-app.js"
  ></script>

</head>


<body>

  <div class="container">


    <!-- HEADER -->

    <div class="header">

      <div class="logo">
        LB
      </div>

      <h1>
        LBC Referrals
      </h1>

      <p>
        Invite friends and grow
        the LBC community
      </p>

    </div>


    <!-- REFERRAL COUNT -->

    <div class="card balance-card">

      <p class="label">
        TOTAL REFERRALS
      </p>

      <div id="referrals">
        0
      </div>

      <p class="rate">
        Your LBC Community
      </p>

    </div>


    <!-- REFERRAL CODE -->

    <div class="card referral-card">

      <h3>
        🎁 Your Referral Code
      </h3>

      <div
        id="refCode"
        class="ref-code"
      >
        Loading...
      </div>

    </div>


    <!-- REFERRAL LINK -->

    <div class="card referral-card">

      <h3>
        🔗 Your Referral Link
      </h3>

      <div
        id="refLink"
        class="ref-link"
      >
        Loading...
      </div>


      <button
        id="copyRefBtn"
        class="menu-button"
      >
        📋 COPY REFERRAL LINK
      </button>

    </div>


    <!-- BACK -->

    <div class="card menu-card">

      <button
        id="backBtn"
        class="menu-button"
      >
        ← BACK TO MINING
      </button>

    </div>


    <div class="card info">

      <h3>
        🚀 LBC Community
      </h3>

      <p>
        Share your referral link with
        your friends and invite them
        to the LBC Mining community.
      </p>

    </div>


    <p class="footer">
      LBC Mining App
    </p>

  </div>


  <script src="referrals.js"></script>

</body>

</html>
