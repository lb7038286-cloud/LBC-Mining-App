<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LBC Mining App</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">LB</div>
      <h1>LBC Mining</h1>
      <p id="welcome">Welcome, Miner</p>
    </div>

    <div class="card balance-card">
      <p class="label">LBC BALANCE</p>
      <div id="balance">0.00</div>
      <p class="rate">Mining Rate: 0.10 LBC / Minute</p>
    </div>

    <div class="card mining-card">

      <div class="status">
        <span id="dot"></span>
        <span id="status">Mining Stopped</span>
      </div>

      <div class="timer" id="timer">00:00:00</div>

      <button id="mineBtn">START MINING</button>

    </div>

    <div class="card stats">

      <div class="stat">
        <span>Session Reward</span>
        <strong id="session">0.00 LBC</strong>
      </div>

      <div class="stat">
        <span>Referrals</span>
        <strong id="referrals">0</strong>
      </div>

    </div>

    <div class="card info">
      <h3>🚀 LBC Mining</h3>
      <p>
        Start your mining session and earn demo LBC rewards.
      </p>
    </div>

    <p class="footer">
      LBC Mining App
    </p>

  </div>

  <script src="app.js"></script>

</body>
</html>
